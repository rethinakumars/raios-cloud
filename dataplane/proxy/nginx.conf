worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;

    upstream floci_upstream {
        server 127.0.0.1:4566;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://floci_upstream;
        }
    }
}

